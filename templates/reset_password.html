{% extends 'base.html' %}{% block title %}Create new password{% endblock %}
{% block content %}
<div class="login-panel">
  <form class="login-card recovery-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="eyebrow">ACCOUNT RECOVERY · STEP 3 OF 3</div>
    <div class="recovery-symbol" aria-hidden="true">✓</div>
    <h2>Create a new password</h2>
    <p class="muted recovery-intro">Your email is verified. Choose a new password to finish recovering your account.</p>
    <label for="password">New password
      <input id="password" type="password" name="password" minlength="10" required autocomplete="new-password" placeholder="At least 10 characters">
    </label>
    <label for="confirmation">Confirm new password
      <input id="confirmation" type="password" name="confirmation" minlength="10" required autocomplete="new-password" placeholder="Enter the password again">
    </label>
    <button class="btn primary full" type="submit">Save new password</button>
  </form>
</div>
{% endblock %}
