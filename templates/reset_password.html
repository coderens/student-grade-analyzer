{% extends 'base.html' %}{% block title %}Set new password{% endblock %}
{% block content %}
<div class="login-panel">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="eyebrow">ACCOUNT RECOVERY</div>
    <h2>Set a new password</h2>
    <p class="muted">Choose a strong password with at least 10 characters.</p>
    <label>New password<input type="password" name="password" minlength="10" required autocomplete="new-password"></label>
    <label>Confirm new password<input type="password" name="confirmation" minlength="10" required autocomplete="new-password"></label>
    <button class="btn primary full" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
